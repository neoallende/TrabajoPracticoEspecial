services:
  db:
    image: postgres:15-alpine
    container_name: server_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U root -d db"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: server_go
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://root:secretpassword@db:5432/db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
